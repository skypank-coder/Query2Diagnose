# Romanized Hindi -> English lexicon for core/normalize.py (hand-built).
# `native` (Devanagari) lets bench/seed_lexicon.py add attested spellings from
# Aksharantar, and COMI-LINGUA text-normalisation pairs add real Hinglish
# misspellings (data/lexicon/seeds.json). Longest form wins. Forms that are
# also common English words (me, he, main) are deliberately left out.
