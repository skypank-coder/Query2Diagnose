# LLM client defaults (core/llm.py). Provider, model and keys come from .env.
# Prices are USD per 1M tokens, used only for the pre-run estimate and the
# MAX_USD_PER_RUN guard. Check the provider's pricing page before a paid run;
# a model missing here is estimated with `default`.

defaults:
  provider: mock
  model: mock-1
  timeout_s: 60
  max_retries: 6

base_urls:
  groq: https://api.groq.com/openai/v1
  openai: https://api.openai.com/v1
  ollama: http://localhost:11434/v1
  anthropic: https://api.anthropic.com/v1

prices_per_million:          # paid-tier estimates; the Groq free tier costs $0
  default: {input: 0.50, output: 1.50}
  mock-1: {input: 0.0, output: 0.0}
  openai/gpt-oss-20b: {input: 0.10, output: 0.50}
  openai/gpt-oss-120b: {input: 0.15, output: 0.75}
  qwen/qwen3.8-27b: {input: 0.30, output: 0.60}
  gpt-4o-mini: {input: 0.15, output: 0.60}

# Extra request fields per model. Reasoning models spend hidden reasoning tokens
# that count against max_tokens, so they get extra headroom.
model_params:
  openai/gpt-oss-20b: {reasoning_effort: low, extra_max_tokens: 400}
  openai/gpt-oss-120b: {reasoning_effort: low, extra_max_tokens: 400}

# Free-tier friendly throttle (Groq gpt-oss-20b on 2026-10-28: 8,000 tokens/min,
# 1,000 requests/day); raise in .env (LLM_RPM, LLM_TPM) on paid tiers.
rate_limits: {rpm: 30, tpm: 8000}
max_retry_wait_s: 120        # a longer server-requested wait means the quota is exhausted
