# Experiment grid (eval/run_experiment.py). `--profile NAME` overlays a profile.
split: test
systems: [b1_direct, b2_llm_questions, b3_infogain_dx, q2d,
          q2d_minus_hl, q2d_minus_fault_state, q2d_minus_cost_clarity, q2d_minus_normalisation]
conditions: [clean, spelling, codemixed_kn, codemixed_hi, incomplete, combined_kn, combined_hi]
seeds: [0, 1, 2]
max_cases: null           # null = every case in the split; an int = stratified subset (one per fault, round-robin)
include_stress: true      # also run the Kannada + Hindi + English stress set (reported separately)
simulator: {mode: deterministic}
overrides: {}             # AgentConfig overrides, e.g. {K: 4}
hypothesis_weights: null  # null = base; or a sensitivity set from configs/hypothesis.yaml
clarity_model: null       # LLM playing the A(q) mock users; null = the system LLM

profiles:
  # Fits the Groq free tier (1,000 requests/day for the system model): one case
  # per fault, one seed, the systems that need no extra LLM calls beyond the
  # main four (q2d_minus_hl shares B3's cached parse, q2d_minus_cost_clarity
  # shares Q2D's). A(q) mock users run on a different model's quota.
  pilot:
    systems: [b1_direct, b2_llm_questions, b3_infogain_dx, q2d, q2d_minus_hl, q2d_minus_cost_clarity]
    seeds: [0]
    max_cases: 15
    include_stress: false
    overrides: {K: 4}
    clarity_model: openai/gpt-oss-120b
  noisy_sim:
    simulator: {mode: noisy}
  sensitivity:
    systems: [b3_infogain_dx, q2d]
    seeds: [0]
