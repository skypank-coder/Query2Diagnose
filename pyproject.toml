[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "query2diagnose"
version = "0.1.0"
description = "Uncertainty-aware interactive troubleshooting from noisy, code-mixed and incomplete user descriptions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["core", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
