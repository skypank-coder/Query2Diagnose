[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "query2diagnose"
version = "0.1.0"
description = "Uncertainty-aware interactive troubleshooting from noisy, code-mixed and incomplete user descriptions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "rapidfuzz>=3.6",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "pandas>=2.2",
    "pyarrow>=15",
    "sentence-transformers>=3.0",   # install CPU torch first: pip install torch --index-url https://download.pytorch.org/whl/cpu
    "faiss-cpu>=1.8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "relplot>=0.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["core", "bench", "eval", "sim", "systems", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
